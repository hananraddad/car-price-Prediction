    <style>
        :root {
            --bg-1: #fdf1f5;
            --bg-2: #f6dbe7;
            --accent: #9d4a6f;
            --accent-dark: #7a3556;
            --ink: #3b2a33;
            --muted: #7d6571;
        }
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
        }
        .container { max-width: 840px; padding-bottom: 48px; }

        h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: .2px;
            color: var(--accent-dark);
        }
        h1::after {
            content: "";
            display: block;
            width: 56px; height: 3px;
            margin: 14px auto 0;
            border-radius: 3px;
            background: var(--accent);
        }
        .subtitle { color: var(--muted); font-size: .95rem; }

        /* كارد الفورم */
        #predictionForm {
            background: #ffffff;
            border: 1px solid #ecd3de;
            border-radius: 20px;
            padding: 30px 24px 34px;
            box-shadow: 0 10px 30px rgba(122, 53, 86, .10);
            animation: fadeUp .6s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أسماء الفيتشرز: كبسولات بلون هادي موحد */
        .form-label {
            display: inline-block;
            padding: 5px 16px;
            margin-bottom: 8px;
            border-radius: 999px;
            font-weight: 500;
            font-size: .82rem;
            letter-spacing: .3px;
            color: var(--accent-dark);
            background: #f8e3ec;
            border: 1px solid #efc9da;
            cursor: default;
            transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
        }
        .form-label:hover {
            transform: scale(1.06);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 6px 14px rgba(157, 74, 111, .28);
        }

        /* الحقول */
        .form-select {
            border: 1px solid #e3cdd8;
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--ink);
            background-color: #fff;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .form-select:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
            box-shadow: 0 6px 16px rgba(157, 74, 111, .14);
        }
        .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 .2rem rgba(157, 74, 111, .18);
        }

        /* الزر */
        .btn-predict {
            border: 0;
            border-radius: 12px;
            padding: 12px 54px;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: .4px;
            color: #fff;
            background: var(--accent);
            box-shadow: 0 8px 20px rgba(122, 53, 86, .28);
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .btn-predict:hover {
            transform: translateY(-2px) scale(1.04);
            background: var(--accent-dark);
            box-shadow: 0 12px 26px rgba(122, 53, 86, .35);
            color: #fff;
        }
        .btn-predict:active { transform: scale(.98); }
        .btn-predict:disabled { opacity: .8; color: #fff; background: var(--accent); }

        /* النتيجة */
        .output .alert {
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 500;
            text-align: center;
            padding: 18px;
            animation: fadeUp .4s ease both;
        }
        .output .alert-success {
            background: #fff;
            color: var(--accent-dark);
            border: 1px solid #e3cdd8;
            border-left: 5px solid var(--accent);
            box-shadow: 0 8px 22px rgba(122, 53, 86, .10);
        }
        .output .alert-danger {
            background: #fff;
            color: #8a2c3f;
            border: 1px solid #ecc5cc;
            border-left: 5px solid #c2455c;
        }

        /* السيارات حوالين العنوان */
        .title-row { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; margin-bottom: 4px; }
        .title-cars { display: flex; align-items: flex-end; gap: 12px; }
        .title-row h1 { margin: 0; }
        .car { background: none; border: 0; padding: 0; width: 74px; cursor: pointer; transition: transform .2s ease; -webkit-tap-highlight-color: transparent; }
        .car svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 4px rgba(122, 53, 86, .22)); }
        .car.left svg { transform: scaleX(-1); }
        .car:hover { transform: translateY(-3px) scale(1.1); }
        .car:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
        .car .wheel { transform-box: fill-box; transform-origin: center; }
        .car.left { --dx: -34px; }
        .car.right { --dx: 34px; }
        .car.go { animation: drive 1s ease-in-out; }
        .car.go .wheel { animation: spin 1s linear; }
        @keyframes drive {
            0%   { transform: translateX(0); }
            15%  { transform: translateX(-4px) rotate(calc(var(--dx) / -30deg)); }
            50%  { transform: translateX(var(--dx)); }
            100% { transform: translateX(0); }
        }
        @keyframes spin { to { transform: rotate(900deg); } }
        @media (max-width: 640px) {
            .car { width: 52px; }
            .title-row { gap: 10px; }
            .title-row h1 { order: -1; width: 100%; font-size: 1.6rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .car.go, .car.go .wheel { animation: none; }
        }
    </style>
</head>

        const manufacturerSelect = document.getElementById("Manufacturer");
        const modelSelect = document.getElementById("Model");

        function populateModels(selectedModel = "") {
            const models = modelsByManufacturer[manufacturerSelect.value] || [];
            modelSelect.innerHTML = '<option value="">-- Select Model --</option>';
            models.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m;
                opt.textContent = m;
                if (m === selectedModel) opt.selected = true;
                modelSelect.appendChild(opt);
            });
        }

        manufacturerSelect.addEventListener("change", () => populateModels());

        // القيمة الافتراضية: LEXUS + RX 450
        manufacturerSelect.value = "LEXUS";
        populateModels("RX 450");

        // السيارات: اكبس عليها لتتحرك
        document.querySelectorAll('.car').forEach(c => {
            c.addEventListener('click', () => {
                c.classList.remove('go');
                void c.offsetWidth; // إعادة تشغيل الأنيميشن
                c.classList.add('go');
            });
            c.addEventListener('animationend', e => {
                if (e.target === c) c.classList.remove('go');
            });
        });

        async function submitForm() {
            const btn = document.getElementById('predictBtn');
            btn.disabled = true;
            btn.textContent = 'Predicting...';
            const form = document.getElementById('predictionForm');
            const formData = new FormData(form);
            const data = {};

            // Convert form data to JSON object
            formData.forEach((value, key) => {
                // Parse numbers where applicable
                if (!isNaN(Number(value)) && value !== "") {
                    data[key] = parseFloat(value);
                } else {
                    data[key] = value;
                }
            });

            console.log("Data being sent:", data); // Debugging

            try {
                const response = await fetch("http://127.0.0.1:8000/predict/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data) // Send data as JSON
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById("output").innerHTML =
                        `<div class="alert alert-success">Prediction: ${JSON.stringify(result["prediction"])}</div>`;
                } else {
                    const error = await response.json();
                    document.getElementById("output").innerHTML =
                        `<div class="alert alert-danger">Error: ${JSON.stringify(error.detail)}</div>`;
                }
            } catch (err) {
                document.getElementById("output").innerHTML =
                    `<div class="alert alert-danger">An unexpected error occurred: ${err}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Predict';
            }
        }
    </script>
